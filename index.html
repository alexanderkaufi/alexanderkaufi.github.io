<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="robots" content="noindex" />
    <title>CycleContext</title>
    <script>
      const savedLanguage = localStorage.getItem("cyclecontext-language");
      const browserLanguage = navigator.language.toLowerCase().startsWith("de") ? "de" : "en";
      location.replace(`./${savedLanguage || browserLanguage}/`);
    </script>
  </head>
  <body>
    <p><a href="./de/">Deutsch</a> · <a href="./en/">English</a></p>
  </body>
</html>
